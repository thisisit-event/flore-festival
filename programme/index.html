<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[TEST] Programme · FLORE Festival</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2D5479">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://enjoylife.b-cdn.net" crossorigin>
<link rel="stylesheet" href="/assets/flore.css?v=20261004c">
<style>
  /* Page app blanche à plat : pas le fond ciel animé des autres pages, qui ressortait
     dans la zone réservée à la barre d'onglets fixe du bas sur mobile. */
  body{background:#fff}
  @media(max-width:759px){ body{padding-bottom:82px} }

  /* Le CTA billetterie flottant global ne sait pas se masquer sans #accueil/#billetterie
     sur cette page, et percute la barre d'onglets : on le retire ici, la barre du
     bas fait déjà office de navigation principale. */
  .mobile-cta-float{display:none !important}

  .app-head{position:sticky;top:0;z-index:80;background:#fff;border-bottom:1.5px solid var(--line);padding:110px 0 0}
  @media(max-width:759px){.app-head{padding:96px 0 0}}
  .app-head .wrap{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
  .app-title{font-size:1.5rem;color:var(--ink)}
  .app-search{display:flex;align-items:center;gap:10px;background:var(--sky-pale);border-radius:100px;padding:11px 18px}
  .app-search svg{width:18px;height:18px;color:var(--sky-deep);flex:none}
  .app-search input{border:none;background:none;outline:none;font:inherit;font-size:.95rem;color:var(--ink);width:100%}

  .app-main{background:#fff;min-height:50vh}
  .app-main .wrap{max-width:1180px;padding-top:22px;padding-bottom:40px}

  /* Grille de cartes */
  .prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
  @media(max-width:480px){.prog-grid{grid-template-columns:repeat(2,1fr);gap:12px}}

  /* Onglet "Tout" : une ligne par catégorie qui défile horizontalement (aperçu
     rapide), plutôt qu'une grille qui s'empile sur plusieurs lignes. */
  .prog-row{display:flex;gap:16px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .prog-row .prog-card{flex:0 0 220px;scroll-snap-align:start}
  .prog-row::-webkit-scrollbar{height:6px}
  .prog-row::-webkit-scrollbar-thumb{background:var(--line);border-radius:100px}
  @media(max-width:480px){.prog-row .prog-card{flex-basis:168px}}

  /* Ligne "maintenant" : span toute la largeur de la grille */
  .now-line{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:6px 0 2px;color:#E5484D}
  .now-line b{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  .now-line .bar{flex:1;height:2px;background:#E5484D;position:relative}
  .now-line .bar::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:#E5484D}

  /* Carte programme, façon ticket de festival */
  .prog-card{position:relative;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);background:#fff;display:flex;flex-direction:column;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .prog-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .prog-card-link{display:flex;flex-direction:column;flex:1;text-decoration:none;color:inherit}
  .prog-card-head{padding:16px 44px 14px 16px;color:#fff}
  .prog-card-head.t-artiste{background:linear-gradient(165deg,var(--sky) 0%,var(--sky-deep) 100%)}
  .prog-card-head.t-causerie{background:linear-gradient(165deg,var(--dusk) 0%,var(--navy) 100%)}
  .prog-card-head.t-exposant{background:linear-gradient(165deg,var(--coral) 0%,var(--twilight) 100%)}
  .pc-time{font-family:'Telegraf',system-ui,sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.03em;color:rgba(255,255,255,.85);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pc-titre{font-family:'Telegraf',system-ui,sans-serif;font-weight:800;font-size:1.1rem;line-height:1.15;text-wrap:balance}
  .prog-card-photo{position:relative;aspect-ratio:1/1;background:var(--sky-pale);overflow:hidden}
  .prog-card-photo img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
  .prog-card-photo .ph-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;opacity:.55}
  .prog-card-body{padding:10px 16px 16px}
  .pc-tags{display:flex;flex-wrap:wrap;gap:5px}
  .item-tag{font-size:.68rem;font-weight:700;color:var(--sky-deep);background:var(--sky-pale);padding:2px 9px;border-radius:100px}

  .item-fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(11,24,50,.45);backdrop-filter:blur(4px);border:none;cursor:pointer;color:#fff;z-index:2}
  .item-fav svg{width:19px;height:19px;transition:transform .15s var(--ease)}
  .item-fav.is-active{color:#E5484D;background:rgba(255,255,255,.9)}
  .item-fav.is-active svg{fill:#E5484D;transform:scale(1.12)}

  .conflict-note{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:#FFF4E5;color:#9A5B00;font-size:.78rem;font-weight:700;padding:8px 14px;border-radius:10px;margin:-4px 0 10px}
  .sub-head{grid-column:1/-1;font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--sky-deep);margin:24px 0 4px}
  .prog-section-title{font-family:'Telegraf',system-ui,sans-serif;font-size:1.15rem;font-weight:800;color:var(--ink);margin:36px 0 14px}

  .app-empty{text-align:center;padding:60px 20px;color:var(--ink-soft)}
  .app-empty svg{width:44px;height:44px;opacity:.4;margin-bottom:12px}
  .app-empty a{color:var(--sky-deep);font-weight:700}

  /* Barre d'onglets : horizontale dans le header sur desktop/tablette, fixe en bas façon appli sur mobile */
  .app-tabbar{display:flex;gap:6px;justify-content:center}
  .app-tab{display:flex;align-items:center;gap:8px;padding:9px 16px;background:none;border:none;border-radius:100px;cursor:pointer;color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:.88rem;transition:background .15s var(--ease),color .15s var(--ease)}
  .app-tab:hover{background:var(--sky-pale)}
  .app-tab svg{width:19px;height:19px}
  .app-tab.is-active{color:var(--sky-deep);background:var(--sky-pale)}
  .app-tab[data-tab="causerie"].is-active{color:var(--dusk);background:rgba(92,78,146,.12)}
  .app-tab[data-tab="exposant"].is-active{color:#D8683A;background:rgba(255,139,94,.16)}
  .app-tab[data-tab="favoris"].is-active{color:#E5484D;background:rgba(229,72,77,.12)}
  .app-tab .badge{position:relative;display:flex}
  .app-tab .count{position:absolute;top:-6px;right:-8px;background:#E5484D;color:#fff;font-size:.6rem;font-weight:800;min-width:15px;height:15px;border-radius:100px;display:flex;align-items:center;justify-content:center;padding:0 3px}

  @media(max-width:759px){
    .app-tabbar{position:fixed;bottom:0;left:0;right:0;z-index:150;background:#fff;border-top:1.5px solid var(--line);box-shadow:0 -8px 24px rgba(11,24,50,.08);padding-bottom:env(safe-area-inset-bottom);gap:0}
    .app-tab{flex:1;flex-direction:column;gap:3px;padding:10px 4px 8px;border-radius:0;font-size:.68rem}
    .app-tab:hover{background:none}
    .app-tab.is-active{background:none}
    .app-tab svg{width:22px;height:22px}
  }

  .test-banner{position:fixed;bottom:0;left:0;right:0;z-index:149;background:var(--navy);color:#fff;text-align:center;padding:8px 16px;font-size:.78rem;font-weight:700}
  .test-banner span{color:var(--sun)}
  @media(max-width:759px){ .test-banner{bottom:82px} }
</style>
</head>
<body>

<div id="site-nav"></div>
<script src="/assets/gate.js?v=3"></script>
<script src="/assets/nav.js?v=20261004b"></script>

<header class="app-head">
  <div class="wrap">
    <h1 class="app-title">Le programme</h1>
    <div class="app-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="Chercher un artiste, une causerie, un exposant...">
    </div>
    <nav class="app-tabbar">
      <button class="app-tab is-active" data-tab="tout">
        <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
        <span>Tout</span>
      </button>
      <button class="app-tab" data-tab="artiste">
        <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
        <span>Concerts</span>
      </button>
      <button class="app-tab" data-tab="causerie">
        <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></span>
        <span>Causeries</span>
      </button>
      <button class="app-tab" data-tab="exposant">
        <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-6h16l1 6M3 9v11h18V9M3 9h18M9 21v-6h6v6"/></svg></span>
        <span>Exposants</span>
      </button>
      <button class="app-tab" data-tab="favoris">
        <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 000-7.8z"/></svg><span class="count" id="fav-count" style="display:none">0</span></span>
        <span>Mon programme</span>
      </button>
    </nav>
  </div>
</header>

<main class="app-main">
  <div class="wrap" id="app-content">
    <div class="app-empty">Chargement du programme...</div>
  </div>
</main>


<script>
(function(){
  var TYPES = {
    artiste:  { emoji:'🎵', base:'/artistes/',    file:'/assets/data/artistes.json' },
    causerie: { emoji:'🎤', base:'/causeries/',    file:'/assets/data/talks.json' },
    exposant: { emoji:'🛍️', base:'/nos-exposants/', file:'/assets/data/exposants.json' }
  };
  var FAV_KEY = 'flore-mon-programme';
  var CACHE_PREFIX = 'flore-cache:';
  var state = { items: [], activeTab: 'tout', query: '' };

  function loadFavs(){
    try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch(e){ return []; }
  }
  function saveFavs(favs){
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e){}
  }
  function favKey(type, slug){ return type + ':' + slug; }
  function isFav(type, slug){ return loadFavs().indexOf(favKey(type, slug)) !== -1; }
  function toggleFav(type, slug){
    var favs = loadFavs();
    var k = favKey(type, slug);
    var i = favs.indexOf(k);
    if(i === -1) favs.push(k); else favs.splice(i, 1);
    saveFavs(favs);
    updateFavCount();
  }
  function updateFavCount(){
    var n = loadFavs().length;
    var el = document.getElementById('fav-count');
    if(n > 0){ el.style.display = 'flex'; el.textContent = n; } else { el.style.display = 'none'; }
  }

  function fetchWithCache(url){
    return fetch(url + '?v=' + Date.now()).then(function(r){ return r.json(); }).then(function(data){
      try { localStorage.setItem(CACHE_PREFIX + url, JSON.stringify(data)); } catch(e){}
      return data;
    }).catch(function(){
      try {
        var cached = localStorage.getItem(CACHE_PREFIX + url);
        if(cached) return JSON.parse(cached);
      } catch(e){}
      return [];
    });
  }

  function normalize(type, raw){
    var t = TYPES[type];
    return raw.map(function(a){
      if(type === 'artiste'){
        return { type:type, slug:a.slug, titre:a.nom, heure:a.heure, zone:null, sous:a.scene, tags:a.genres||[], href:t.base+a.slug+'/', photo:a.photo_url||null };
      }
      if(type === 'causerie'){
        var noms = (a.intervenants||[]).map(function(i){ return i.nom; }).join(', ');
        return { type:type, slug:a.slug, titre:a.titre, heure:a.heure, zone:null, sous:(a.lieu||'') + (noms ? ' · ' + noms : ''), tags:a.tags||[], href:t.base+a.slug+'/' };
      }
      // exposant : pas d'horaire, juste une zone (présent toute la journée)
      return { type:type, slug:a.slug, titre:a.nom, heure:null, zone:a.zone||'', sous:a.lieu||'', tags:a.categories||[], href:t.base+a.slug+'/' };
    });
  }

  function nowHHMM(){
    var d = new Date();
    return String(d.getHours()).padStart(2,'0') + 'h' + String(d.getMinutes()).padStart(2,'0');
  }

  function renderCard(item){
    var t = TYPES[item.type];
    var active = isFav(item.type, item.slug);
    var tagsHtml = (item.tags||[]).slice(0,3).map(function(g){ return '<span class="item-tag">'+g+'</span>'; }).join('');
    var card = document.createElement('div');
    card.className = 'prog-card';
    var timeLabel = item.heure ? (item.heure + (item.sous ? ' · ' + item.sous : '')) : (item.zone || item.sous || '');
    var photoHtml = item.photo
      ? '<img src="'+item.photo+'" alt="" loading="lazy">'
      : '<div class="ph-emoji">'+t.emoji+'</div>';
    card.innerHTML =
      '<a href="'+item.href+'" class="prog-card-link">' +
        '<div class="prog-card-head t-'+item.type+'">' +
          '<div class="pc-time">'+timeLabel+'</div>' +
          '<div class="pc-titre">'+item.titre+'</div>' +
        '</div>' +
        '<div class="prog-card-photo">' + photoHtml + '</div>' +
        (tagsHtml ? '<div class="prog-card-body"><div class="pc-tags">'+tagsHtml+'</div></div>' : '') +
      '</a>' +
      '<button class="item-fav'+(active?' is-active':'')+'" aria-label="Ajouter à mon programme" data-type="'+item.type+'" data-slug="'+item.slug+'">' +
        '<svg viewBox="0 0 24 24" fill="'+(active?'currentColor':'none')+'" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 000-7.8z"/></svg>' +
      '</button>';
    card.querySelector('.item-fav').addEventListener('click', function(e){
      e.preventDefault();
      toggleFav(this.dataset.type, this.dataset.slug);
      render();
    });
    return card;
  }

  var GROUP_LABELS = { artiste: '🎵 Concerts', causerie: '🎤 Causeries', exposant: '🛍️ Exposants' };

  // Construit une grille de cartes (horaire trié + ligne "maintenant" + exposants
  // non programmés à part) dans le conteneur donné. Réutilisé pour un onglet seul
  // (Concerts, Causeries...) comme pour chaque sous-groupe de l'onglet "Tout".
  function renderGroup(container, list, opts){
    opts = opts || {};
    var grid = document.createElement('div');
    grid.className = opts.horizontal ? 'prog-row' : 'prog-grid';
    container.appendChild(grid);

    // Les exposants n'ont pas d'horaire (présents toute la journée) : tri alphabétique, pas de ligne "maintenant", pas de conflit
    var scheduled = list.filter(function(it){ return !!it.heure; }).sort(function(a,b){ return a.heure.localeCompare(b.heure); });
    var unscheduled = list.filter(function(it){ return !it.heure; }).sort(function(a,b){ return a.titre.localeCompare(b.titre); });

    if(opts.conflictCheck && scheduled.length){
      var byTime = {};
      scheduled.forEach(function(it){ (byTime[it.heure] = byTime[it.heure] || []).push(it); });
      var hasConflict = Object.keys(byTime).some(function(h){ return byTime[h].length > 1; });
      if(hasConflict){
        var note = document.createElement('div');
        note.className = 'conflict-note';
        note.innerHTML = '⚠️ Deux éléments de votre programme ont lieu en même temps, vérifiez les horaires.';
        grid.appendChild(note);
      }
    }

    var now = nowHHMM();
    var nowInserted = false;
    function insertNowLine(){
      var line = document.createElement('div');
      line.className = 'now-line';
      line.innerHTML = '<b>Maintenant · '+now+'</b><div class="bar"></div>';
      grid.appendChild(line);
      nowInserted = true;
    }
    scheduled.forEach(function(item){
      if(opts.showNowLine && !nowInserted && item.heure >= now) insertNowLine();
      grid.appendChild(renderCard(item));
    });
    if(opts.showNowLine && !nowInserted && scheduled.length) insertNowLine();

    if(unscheduled.length){
      if(opts.unscheduledSubhead && scheduled.length){
        var subhead = document.createElement('div');
        subhead.className = 'sub-head';
        subhead.textContent = opts.unscheduledSubhead;
        grid.appendChild(subhead);
      }
      unscheduled.forEach(function(item){ grid.appendChild(renderCard(item)); });
    }
  }

  function render(){
    var content = document.getElementById('app-content');
    content.innerHTML = '';

    var list;
    var isFavTab = state.activeTab === 'favoris';
    var isToutTab = state.activeTab === 'tout';
    if(isFavTab){
      var favs = loadFavs();
      list = state.items.filter(function(it){ return favs.indexOf(favKey(it.type, it.slug)) !== -1; });
    } else if(isToutTab){
      list = state.items.slice();
    } else {
      list = state.items.filter(function(it){ return it.type === state.activeTab; });
    }

    if(state.query){
      var q = state.query.toLowerCase();
      list = list.filter(function(it){ return it.titre.toLowerCase().indexOf(q) !== -1 || (it.sous||'').toLowerCase().indexOf(q) !== -1; });
    }

    if(!list.length){
      var empty = document.createElement('div');
      empty.className = 'app-empty';
      empty.innerHTML = isFavTab
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 000-7.8z"/></svg><div>Vous n\'avez encore rien ajouté.<br>Parcourez les concerts, causeries ou exposants et appuyez sur le cœur.</div>'
        : '<div>Rien ne correspond à votre recherche.</div>';
      content.appendChild(empty);
      return;
    }

    // "Tout" : un groupe par type, avec son propre titre, plutôt qu'un mélange
    // chronologique de cartes aux couleurs différentes (moins lisible).
    if(isToutTab){
      Object.keys(GROUP_LABELS).forEach(function(type, i){
        var groupItems = list.filter(function(it){ return it.type === type; });
        if(!groupItems.length) return;
        var title = document.createElement('h2');
        title.className = 'prog-section-title';
        if(i === 0) title.style.marginTop = '0';
        title.textContent = GROUP_LABELS[type];
        content.appendChild(title);
        renderGroup(content, groupItems, { horizontal: true });
      });
      return;
    }

    renderGroup(content, list, {
      showNowLine: true,
      conflictCheck: isFavTab,
      unscheduledSubhead: isFavTab ? '🛍️ Exposants à visiter' : null
    });
  }

  Promise.all(Object.keys(TYPES).map(function(type){
    return fetchWithCache(TYPES[type].file).then(function(raw){ return normalize(type, raw); });
  })).then(function(results){
    state.items = results.flat();
    updateFavCount();
    render();
  });

  document.querySelectorAll('.app-tab').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.app-tab').forEach(function(b){ b.classList.remove('is-active'); });
      this.classList.add('is-active');
      state.activeTab = this.dataset.tab;
      render();
    });
  });

  document.getElementById('search-input').addEventListener('input', function(){
    state.query = this.value;
    render();
  });
})();

// Le fond de cette page est blanc dès le départ (pas de hero coloré derrière la nav) :
// on force la nav en mode "scrolled" (logo/texte foncés) en permanence.
var navEl = document.getElementById('nav');
if(navEl) navEl.classList.add('scrolled');
</script>

</body>
</html>
