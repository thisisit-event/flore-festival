<style>
  /* Pas de hero : la page commence directement sur la grille, juste sous la nav fixe */
  #partenaires{padding-top:132px;padding-bottom:0}
  .partners-showcase{background:#fff;border-radius:var(--r-lg);padding:40px 44px 44px;box-shadow:var(--shadow-sm)}
  .partners-intro{margin-bottom:38px}
  .partners-intro h1{font-size:clamp(1.9rem,4vw,2.6rem);color:var(--ink);line-height:1.1;margin:8px 0 0}
  .partners-intro .kicker{color:var(--ink-soft)}
  .partners-intro .kicker svg.daisy{color:var(--sun-deep)}
  .partners-tier{margin-top:46px}
  .partners-tier:first-child{margin-top:0}
  .partners-tier-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px}
  .partners-tier-title{flex:none;font-family:'Telegraf',sans-serif;font-weight:800;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);padding-bottom:10px;border-bottom:3px solid var(--sun-deep)}
  .partners-tier-head::after{content:'';flex:1;height:1px;background:var(--line);margin-bottom:9px}
  .partners-grid{display:grid;grid-template-columns:repeat(auto-fill,210px);gap:0}
  .partners-cell{border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:20px;height:210px;background:#fff;text-decoration:none;transition:background .2s var(--ease)}
  .partners-cell:hover{background:var(--sky-pale)}
  .partners-cell img{max-height:120px;max-width:85%;width:auto;object-fit:contain;display:block}
  @media(max-width:600px){.partners-grid{grid-template-columns:1fr}}

  /* Devenir partenaire : un simple e-mail, pas de formulaire */
  #devenir-partenaire{padding-top:20px;scroll-margin-top:110px}
  .join-card{display:flex;align-items:center;justify-content:space-between;gap:20px 32px;flex-wrap:wrap;background:#fff;border-radius:var(--r-lg);padding:30px 44px;box-shadow:var(--shadow-sm)}
  .join-card h2{font-size:1.35rem;color:var(--ink);margin:0 0 4px}
  .join-card p{color:var(--ink-soft);font-size:.95rem;margin:0}
  .join-mail{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;font-family:'Telegraf',sans-serif;font-weight:700;font-size:1rem;padding:14px 24px;border-radius:100px;text-decoration:none;transition:background .2s var(--ease),transform .2s var(--ease)}
  .join-mail:hover{background:var(--navy);transform:translateY(-2px)}

  @media(max-width:640px){
    #partenaires{padding-top:112px}
    .partners-showcase{padding:28px 20px 30px}
    .partners-intro{margin-bottom:28px}
    .join-card{flex-direction:column;text-align:center;padding:26px 20px}
    .join-mail{font-size:.92rem;padding:13px 20px}
  }
</style>
</head>
<body>

<div class="sky-bg"></div>
<div class="grain" aria-hidden="true"></div>
<div class="clouds" aria-hidden="true">
  <svg aria-hidden="true" class="cloud cA"><use href="#cloud"/></svg>
  <svg aria-hidden="true" class="cloud cB"><use href="#cloud"/></svg>
  <svg aria-hidden="true" class="cloud cC"><use href="#cloud"/></svg>
  <svg aria-hidden="true" class="cloud cD"><use href="#cloud"/></svg>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="cloud" viewBox="0 0 230 110">
      <g fill="currentColor">
        <circle cx="62" cy="66" r="40"/><circle cx="108" cy="50" r="50"/>
        <circle cx="158" cy="62" r="42"/><circle cx="196" cy="74" r="30"/>
        <circle cx="32" cy="78" r="28"/><rect x="30" y="64" width="170" height="40" rx="20"/>
      </g>
    </symbol>
    <symbol id="daisy" viewBox="0 0 100 100">
      <g transform="translate(50 50)" fill="currentColor">
        <ellipse cx="0" cy="-23" rx="8.6" ry="18"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(45)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(90)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(135)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(180)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(225)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(270)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(315)"/>
      </g>
      <circle cx="50" cy="50" r="13.5" fill="#DAEF52"/>
    </symbol>  </defs>
</svg>

<!-- ===================== GRILLE PARTENAIRES ===================== -->
<section class="sec" id="partenaires">
  <div class="wrap">
    <div class="partners-showcase">
      <div class="partners-intro">
        <span class="kicker"><svg aria-hidden="true" class="daisy"><use href="#daisy"/></svg>Ils rendent FLORE possible</span>
        <h1>Nos partenaires</h1>
      </div>
      <div class="partners-tier">
        <div class="partners-tier-head"><span class="partners-tier-title">Parrain fondateur</span></div>
        <div class="partners-grid">
          <a href="https://www.schaer.com/fr-fr" target="_blank" rel="noopener" class="partners-cell" aria-label="Schär, parrain fondateur">
            <img src="https://enjoylife.b-cdn.net/Flore/schar-logo-off-reverse-flore-festival.png" alt="Schär">
          </a>
        </div>
      </div>
      <div class="partners-tier">
        <div class="partners-tier-head"><span class="partners-tier-title">Avec le parrainage</span></div>
        <div class="partners-grid">
          <a href="https://afdiag.fr/" target="_blank" rel="noopener" class="partners-cell" aria-label="AFDIAG, parrain">
            <img src="https://enjoylife.b-cdn.net/Flore/Partenaires/afdiag_rouge_sur_fond_transparent.png" alt="AFDIAG" style="width:170px;max-width:100%">
          </a>
        </div>
      </div>
      <div class="partners-tier">
        <div class="partners-tier-head"><span class="partners-tier-title">Partenaire officiel</span></div>
        <div class="partners-grid">
          <a href="https://www.rbsansglutenpizza.com/" target="_blank" rel="noopener" class="partners-cell" aria-label="Sans Gluten Pizza, partenaire officiel">
            <img src="https://enjoylife.b-cdn.net/Flore/Partenaires/sans-gluten-pizza-logo-flore-festival.png" alt="Sans Gluten Pizza" style="max-height:147px">
          </a>
        </div>
      </div>
      <div class="partners-tier">
        <div class="partners-tier-head"><span class="partners-tier-title">Partenaire média</span></div>
        <div class="partners-grid">
          <a href="https://www.radioscoop.com/" target="_blank" rel="noopener" class="partners-cell" aria-label="Radio Scoop, partenaire média">
            <img src="https://enjoylife.b-cdn.net/Flore/Partenaires/LOGO-RADIO-SCOOP-vect-RVB-2018.png" alt="Radio Scoop">
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===================== DEVENIR PARTENAIRE ===================== -->
<section class="sec" id="devenir-partenaire">
  <div class="wrap">
    <div class="join-card">
      <div>
        <h2>Devenir partenaire</h2>
        <p>Envie de rejoindre l'aventure ? Écrivez-nous, on revient vers vous rapidement.</p>
      </div>
      <a class="join-mail" href="mailto:contact@flore-festival.fr?subject=Partenariat%20FLORE%20Festival">contact@flore-festival.fr →</a>
    </div>
  </div>
</section>
