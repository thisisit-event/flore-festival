<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[TEST] Nom de la marque · FLORE Festival</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2D5479">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://enjoylife.b-cdn.net" crossorigin>
<link rel="stylesheet" href="/assets/flore.css?v=20261004c">
<style>
  .hero3{position:relative;padding:170px 0 60px;overflow:hidden;background:linear-gradient(165deg,var(--sky-deep) 0%,var(--dusk) 55%,var(--navy) 100%)}
  @media(max-width:640px){.hero3{padding:140px 0 40px}}
  .hero3 .wrap{max-width:760px;display:flex;align-items:center;gap:20px}
  .h3-logo{flex:none;width:84px;height:84px;border-radius:20px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;color:var(--sky-deep)}
  .h3-kicker{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);background:rgba(255,255,255,.75);padding:6px 14px;border-radius:100px;margin-bottom:10px}
  .h3-title{font-size:clamp(1.8rem,5vw,2.8rem);color:#fff;line-height:1.05;margin:0}

  .sec3{background:#fff;padding:56px 0 0}
  .sec3 .wrap{max-width:760px}
  .sec3-kicker{display:flex;align-items:center;gap:10px;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sky-deep);margin-bottom:14px}
  .sec3 p{font-size:1.05rem;line-height:1.75;color:var(--ink-soft)}

  .cat-row{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 32px}
  .cat{font-size:.78rem;font-weight:700;color:var(--sky-deep);background:var(--sky-pale);padding:6px 14px;border-radius:100px}

  .loc-card{background:var(--sky-pale);border-radius:16px;padding:20px 22px;display:flex;align-items:center;gap:16px;margin-bottom:16px}
  .loc-card svg{flex:none;width:26px;height:26px;color:var(--sky-deep)}
  .loc-card .lbl{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sky-deep);margin-bottom:2px}
  .loc-card .val{font-weight:800;color:var(--ink)}
  .loc-card a{margin-left:auto;flex:none;font-size:.85rem;font-weight:700;color:var(--sky-deep)}

  .link-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
  .link-pill{display:inline-flex;align-items:center;gap:8px;background:var(--sky-pale);color:var(--sky-deep);font-weight:700;font-size:.88rem;padding:10px 18px;border-radius:100px;border:1.5px solid var(--line)}

  .close-btn{position:fixed;top:114px;right:18px;z-index:150;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--navy)}
  .close-btn svg{width:20px;height:20px}
  @media(max-width:640px){.close-btn{top:108px;right:14px;width:40px;height:40px}}

  .back-btn{position:fixed;top:114px;left:18px;z-index:150;display:flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 16px;border-radius:100px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);box-shadow:var(--shadow);color:var(--navy);font-weight:800;font-size:.88rem}
  .back-btn svg{width:18px;height:18px}
  @media(max-width:640px){.back-btn{top:108px;left:14px;height:40px;padding:0 14px 0 12px}.back-btn span{display:none}}

  .cta-row{margin:36px 0 60px}
  .cta{display:inline-flex;align-items:center;gap:8px;background:var(--sun);color:var(--navy);font-weight:800;font-size:.95rem;padding:15px 28px;border-radius:100px}

  .test-banner{position:fixed;bottom:0;left:0;right:0;z-index:999;background:var(--navy);color:#fff;text-align:center;padding:10px 16px;font-size:.85rem;font-weight:700}
  .test-banner span{color:var(--sun)}
</style>
</head>
<body>

<div id="site-nav"></div>
<script src="/assets/gate.js?v=3"></script>
<script src="/assets/nav.js?v=20261004b"></script>

<a href="/programme/" class="back-btn" aria-label="Retour au programme">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  <span>Retour</span>
</a>
<a href="/programme/" class="close-btn" aria-label="Fermer et revenir au programme">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>

<header class="hero3">
  <div class="wrap">
    <div class="h3-logo" id="e-logo">?</div>
    <div>
      <span class="h3-kicker">🛍️ Exposant</span>
      <h1 class="h3-title" id="e-nom">Nom de la marque</h1>
    </div>
  </div>
</header>

<section class="sec3">
  <div class="wrap">
    <div class="sec3-kicker">✦ À propos</div>
    <p id="e-description">Description courte de l'exposant.</p>

    <div class="cat-row" id="e-categories"></div>

    <div class="loc-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <div>
        <div class="lbl">Où le trouver</div>
        <div class="val" id="e-lieu">Boutique · Hall A</div>
      </div>
      <a href="/plan-interactif/hall-b.html" id="e-plan-link">Voir sur le plan &rarr;</a>
    </div>

    <div class="link-row" id="e-links"></div>

    <div class="cta-row">
      <a href="/programme/" class="cta">Voir tout le programme &rarr;</a>
    </div>
  </div>
</section>


<script>
(function(){
  var SLUG = 'exemple-exposant';
  fetch('/assets/data/exposants.json?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(exposants){
      var a = exposants.find(function(x){ return x.slug === SLUG; });
      if(!a) return;

      document.title = a.nom + ' · FLORE Festival';
      document.getElementById('e-nom').textContent = a.nom;
      document.getElementById('e-logo').textContent = a.nom.slice(0,2).toUpperCase();
      document.getElementById('e-description').textContent = a.description;
      document.getElementById('e-lieu').textContent = a.lieu;
      if(a.plan_url) document.getElementById('e-plan-link').href = a.plan_url;

      var catEl = document.getElementById('e-categories');
      (a.categories || []).forEach(function(c){
        var span = document.createElement('span');
        span.className = 'cat';
        span.textContent = c;
        catEl.appendChild(span);
      });

      var linksEl = document.getElementById('e-links');
      if(a.site_url){
        var s = document.createElement('a');
        s.href = a.site_url; s.target = '_blank'; s.rel = 'noopener';
        s.className = 'link-pill'; s.textContent = '🌐 Site web';
        linksEl.appendChild(s);
      }
      if(a.instagram_url){
        var ig = document.createElement('a');
        ig.href = a.instagram_url; ig.target = '_blank'; ig.rel = 'noopener';
        ig.className = 'link-pill'; ig.textContent = '📷 Instagram';
        linksEl.appendChild(ig);
      }
    })
    .catch(function(err){ console.warn('Impossible de charger exposants.json', err); });
})();

var navEl = document.getElementById('nav');
var onScroll = function(){ navEl && navEl.classList.toggle('scrolled', window.scrollY > 30); };
onScroll();
window.addEventListener('scroll', onScroll, { passive:true });
</script>

</body>
</html>
