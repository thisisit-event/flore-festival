<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — FLORE Festival</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:radial-gradient(ellipse 60% 50% at 50% 20%,rgba(143,194,103,.3),transparent 70%),#FAF7EE;
    color:#20251E;min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px;
  }
  svg.leaf{width:88px;height:88px;margin-bottom:24px}
  h1{font-family:'Fraunces',serif;font-size:clamp(3.5rem,12vw,6rem);color:#1B3A2A;line-height:1}
  p.t{font-family:'Fraunces',serif;font-style:italic;font-size:1.5rem;color:#EE8B6B;margin:6px 0 14px}
  p.d{color:#5C6154;max-width:34em;margin:0 auto 30px}
  a{
    display:inline-flex;align-items:center;gap:9px;background:#1B3A2A;color:#FAF7EE;
    font-weight:600;padding:15px 30px;border-radius:100px;text-decoration:none;
    transition:transform .25s ease;
  }
  a:hover{transform:translateY(-3px)}
</style>
</head>
<body>
  <div>
    <svg class="leaf" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="26" fill="#1B3A2A"/>
      <path d="M50 20 C29 33 25 63 50 82 C75 63 71 33 50 20 Z" fill="#8FC267"/>
      <path d="M50 28 L50 76" stroke="#1B3A2A" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M50 46 L38 38 M50 56 L62 48 M50 66 L40 60" stroke="#1B3A2A" stroke-width="3.4" stroke-linecap="round"/>
    </svg>
    <h1>404</h1>
    <p class="t">Cette page a pris racine ailleurs.</p>
    <p class="d">La page que vous cherchez n'existe pas ou a été déplacée. Revenons à l'essentiel : la fête, sans gluten et sans lactose.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
