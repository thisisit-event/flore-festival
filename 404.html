<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable · FLORE Festival</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:linear-gradient(180deg,#A6DBF5,#4DA9DF 55%,#2E7FB8);
    color:#fff;min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px;
  }
  .daisy{width:96px;height:96px;margin-bottom:22px;animation:spin 24s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(4rem,13vw,7rem);line-height:1}
  p.t{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.5rem;color:#FFC42E;margin:4px 0 14px}
  p.d{color:rgba(255,255,255,.9);max-width:34em;margin:0 auto 30px}
  a{
    display:inline-flex;align-items:center;gap:9px;background:#FFC42E;color:#15395B;
    font-family:'Fredoka',sans-serif;font-weight:600;padding:15px 32px;border-radius:100px;
    text-decoration:none;transition:transform .25s ease;
  }
  a:hover{transform:translateY(-3px)}
</style>
</head>
<body>
  <div>
    <svg class="daisy" viewBox="0 0 100 100" aria-hidden="true">
      <g transform="translate(50 50)" fill="#fff">
        <ellipse cx="0" cy="-23" rx="8.6" ry="18"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(45)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(90)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(135)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(180)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(225)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(270)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(315)"/>
      </g>
      <circle cx="50" cy="50" r="13.5" fill="#FFC42E"/>
    </svg>
    <h1>404</h1>
    <p class="t">Cette page a pris racine ailleurs.</p>
    <p class="d">La page que vous cherchez n'existe pas ou a été déplacée. Revenons à l'essentiel : la fête, sans gluten et sans lactose.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
