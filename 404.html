<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable · FLORE Festival</title>
<meta name="description" content="La page que vous cherchez n'existe pas ou a été déplacée. Retournez à l'accueil de FLORE Festival, le 1er festival sans gluten et sans lactose.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#2D5479">
<meta property="og:type" content="website">
<meta property="og:title" content="Page introuvable · FLORE Festival">
<meta property="og:description" content="La page recherchée n'existe pas. Retour à l'accueil.">
<meta property="og:image" content="https://enjoylife.b-cdn.net/Flore/flore-festival-site.png">
<link rel="canonical" href="https://flore-festival.fr/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>
@font-face{font-family:'Telegraf';src:url('/assets/fonts/telegraf-regular.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Telegraf';src:url('/assets/fonts/telegraf-ultrabold.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
:root{
  --sky:#4DA9DF;--sky-deep:#2E7FB8;--sun:#DAEF52;--sun-deep:#92A824;
  --ink:#15395B;--night:#0E1E3D;--white:#FFFFFF;--blush:#F2A7BB;
  --ease:cubic-bezier(.34,.1,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Telegraf',system-ui,sans-serif;
  background:linear-gradient(180deg,#6093BE 0%,#4A7FA8 50%,#2D5479 100%);
  color:#fff;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sun);color:var(--ink)}

/* Starlight overlay cohérent avec le site */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1.8px 1.8px at 12% 14%,rgba(255,255,255,.5),transparent 60%),
    radial-gradient(1.4px 1.4px at 78% 32%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(2.2px 2.2px at 45% 68%,rgba(218,239,82,.32),transparent 60%),
    radial-gradient(1.6px 1.6px at 88% 84%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1.4px 1.4px at 22% 92%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(1.8px 1.8px at 64% 22%,rgba(218,239,82,.26),transparent 60%);
  background-size:680px 900px;
  animation:twinkleStars 9s ease-in-out infinite;
}
@keyframes twinkleStars{0%,100%{opacity:.7}50%{opacity:1}}

/* Grain subtil */
body::after{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  opacity:.35;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='180'%20height='180'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.86'%20numOctaves='3'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;
}

/* Logo top */
.brand{
  position:absolute;top:32px;left:32px;z-index:5;
  font-family:'Telegraf',sans-serif;font-weight:800;
  font-size:1.4rem;color:#fff;letter-spacing:-.01em;text-decoration:none;
  display:flex;align-items:center;gap:10px;
}
.brand img{height:32px;width:auto;display:block;filter:drop-shadow(0 2px 7px rgba(11,24,50,.22))}

/* Wrap */
.wrap{
  position:relative;z-index:2;min-height:100vh;
  display:grid;grid-template-columns:1fr 1fr;align-items:center;
  max-width:1180px;margin:0 auto;padding:80px 40px;gap:60px;
}

/* Florette + halo + daisies flottantes */
.scene{position:relative;display:grid;place-items:center;height:480px}
.halo{
  position:absolute;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.5),transparent 65%);
}
.florette{
  position:relative;width:340px;height:auto;z-index:2;
  filter:drop-shadow(0 26px 34px rgba(11,24,50,.32));
  animation:bob 6s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

.d-float{position:absolute;color:#fff;animation:bob 5s ease-in-out infinite}
.d1{top:5%;left:2%;width:60px;color:rgba(255,255,255,.85);animation-delay:.4s}
.d2{bottom:8%;right:0%;width:78px;color:var(--sun);animation-delay:1.2s}
.d3{top:18%;right:6%;width:42px;color:rgba(255,255,255,.7);animation-delay:2s}

/* Speech bubble */
.bubble{
  position:absolute;top:8%;right:-30px;z-index:3;
  background:#fff;color:var(--ink);
  font-family:'Telegraf',sans-serif;font-weight:600;font-size:.95rem;
  padding:12px 18px;border-radius:22px;
  box-shadow:0 18px 40px rgba(11,24,50,.22);
  max-width:180px;line-height:1.35;
  animation:pop .8s var(--ease) backwards;animation-delay:.6s;
}
.bubble::after{
  content:"";position:absolute;bottom:-8px;left:36px;
  width:18px;height:18px;background:#fff;transform:rotate(45deg);
  border-radius:0 0 0 4px;
}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Text content */
.content{position:relative;z-index:2;animation:fadeUp .8s var(--ease) backwards;animation-delay:.2s}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Telegraf',sans-serif;font-weight:700;
  font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sun);background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.22);
  padding:8px 16px;border-radius:100px;margin-bottom:24px;
  backdrop-filter:blur(8px);
}
.kicker svg{width:14px;height:14px;color:var(--sun)}

h1{
  font-family:'Telegraf',sans-serif;font-weight:800;
  font-size:clamp(7rem,16vw,11rem);line-height:.85;letter-spacing:-.04em;
  background:linear-gradient(160deg,var(--sun) 0%,#C8E03A 40%,var(--sun-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:14px;text-shadow:0 0 60px rgba(218,239,82,.4);
  filter:drop-shadow(0 8px 22px rgba(218,239,82,.25));
}

.sub{
  font-family:'Telegraf',sans-serif;font-weight:700;
  font-size:clamp(1.4rem,2.6vw,2rem);color:#fff;line-height:1.15;
  margin-bottom:14px;letter-spacing:-.01em;
}
.sub em{font-style:normal;color:var(--sun)}

.lede{
  color:rgba(255,255,255,.86);font-size:1.05rem;line-height:1.6;
  max-width:32em;margin-bottom:28px;
}

.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  position:relative;display:inline-flex;align-items:center;gap:10px;
  font-family:'Telegraf',sans-serif;font-weight:700;font-size:.95rem;
  padding:14px 26px;border-radius:100px;text-decoration:none;
  transition:transform .3s cubic-bezier(.34,1.45,.5,1),box-shadow .3s var(--ease),background .3s var(--ease);
  overflow:hidden;
}
.btn svg{transition:transform .3s var(--ease)}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn:hover svg{transform:translateX(4px)}
.btn-sun{background:var(--sun);color:var(--ink);box-shadow:0 12px 28px rgba(146,168,36,.4)}
.btn-sun:hover{background:var(--sun-deep);color:#fff;box-shadow:0 20px 44px rgba(146,168,36,.5)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.4);backdrop-filter:blur(8px)}
.btn-ghost:hover{background:#fff;color:var(--sky-deep)}

a:focus-visible,button:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:6px}

/* Mobile */
@media(max-width:880px){
  .wrap{grid-template-columns:1fr;text-align:center;padding:120px 24px 60px;gap:30px}
  .scene{height:300px;order:-1}
  .florette{width:220px}
  .halo{width:280px;height:280px}
  .d1,.d2,.d3{display:none}
  .bubble{right:auto;left:50%;transform:translateX(-30px);top:0}
  .content{display:flex;flex-direction:column;align-items:center}
  .kicker,.cta{justify-content:center}
  h1{font-size:clamp(5.5rem,22vw,8rem)}
  .brand{left:50%;transform:translateX(-50%);top:20px}
}
@media(max-width:480px){
  .florette{width:180px}
  .halo{width:220px;height:220px}
  .lede{font-size:.96rem}
  .cta{flex-direction:column;width:100%}
  .btn{width:100%;justify-content:center}
}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important}
}
</style>
</head>
<body>

<script src="/assets/gate.js?v=3"></script>
<a href="/" class="brand">
  <img src="/assets/logo-flore-white.png" alt="FLORE Festival" loading="eager">
</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="daisy404" viewBox="0 0 100 100">
      <g transform="translate(50 50)" fill="currentColor">
        <ellipse cx="0" cy="-23" rx="8.6" ry="18"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(45)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(90)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(135)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(180)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(225)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(270)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(315)"/>
      </g>
      <circle cx="50" cy="50" r="13.5" fill="#DAEF52"/>
    </symbol>
  </defs>
</svg>

<main class="wrap">
  <div class="content">
    <span class="kicker">
      <svg aria-hidden="true"><use href="#daisy404"/></svg>
      Page introuvable
    </span>
    <h1>404</h1>
    <p class="sub">Cette page a pris racine <em>ailleurs</em>.</p>
    <p class="lede">Pas de panique. Florette cherchait aussi sa place avant FLORE, et regarde où elle est maintenant. Reviens à l'accueil, on a tout ce qu'il te faut.</p>
    <div class="cta">
      <a href="/" class="btn btn-sun">
        Retour à l'accueil
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </a>
      <a href="/#billetterie" class="btn btn-ghost">Voir la billetterie</a>
    </div>
  </div>

  <div class="scene" aria-hidden="true">
    <div class="halo"></div>
    <svg class="d-float d1"><use href="#daisy404"/></svg>
    <svg class="d-float d2"><use href="#daisy404"/></svg>
    <svg class="d-float d3"><use href="#daisy404"/></svg>
    <img class="florette" src="/assets/florette.png" alt="" loading="eager">
    <div class="bubble">Tu cherches quelque chose qui n'existe pas&nbsp;?</div>
  </div>
</main>

</body>
</html>
