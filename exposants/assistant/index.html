<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant exposants · FLORE Festival 2027</title>
<meta name="description" content="Posez vos questions sur votre participation à FLORE Festival : stand, électricité, montage, produits, règles.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2D5479">
<link rel="canonical" href="https://flore-festival.fr/exposants/assistant/">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/flore.css?v=20261004c">
<style>
  .asst-wrap{max-width:720px;margin:0 auto;padding:130px 20px 40px}
  .asst-head{text-align:center;margin-bottom:22px}
  .asst-head h1{font-size:clamp(1.6rem,4vw,2.2rem);color:var(--ink);margin-bottom:8px}
  .asst-head p{color:var(--ink-soft);font-size:.96rem;max-width:42em;margin:0 auto}

  .asst-contact{display:flex;gap:10px;flex-wrap:wrap;background:var(--sky-pale);border:1px solid var(--sky-soft);
    border-radius:16px;padding:14px 16px;margin-bottom:18px}
  .asst-contact label{font-family:'Telegraf',sans-serif;font-size:.74rem;color:var(--ink-soft);display:block;margin-bottom:4px}
  .asst-contact input{flex:1 1 140px;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;
    font-size:.9rem;color:var(--ink);background:#fff}
  .asst-contact input:focus{outline:none;border-color:var(--sky)}
  .asst-contact-note{flex:1 1 100%;font-size:.76rem;color:var(--ink-soft);margin-top:2px}

  .asst-chat{display:flex;flex-direction:column;gap:12px;min-height:200px;margin-bottom:18px}
  .asst-msg{max-width:84%;padding:12px 16px;border-radius:18px;font-size:.94rem;line-height:1.5}
  .asst-msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
  .asst-msg.bot{align-self:flex-start;background:var(--sky-pale);color:var(--ink);border-bottom-left-radius:4px}
  .asst-msg.bot.escalade{background:#FFF1CC}
  .asst-msg.pending{opacity:.6}
  .asst-form-row{display:flex;gap:10px;position:sticky;bottom:16px;background:#fff;padding:10px;
    border-radius:100px;box-shadow:0 10px 30px rgba(21,57,91,.12);border:1.5px solid var(--line)}
  .asst-form-row input{flex:1;border:none;outline:none;font-size:.96rem;padding:8px 10px;color:var(--ink)}
  .asst-form-row button{background:var(--sun);color:var(--ink);border:none;border-radius:100px;
    padding:10px 20px;font-family:'Telegraf',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;
    white-space:nowrap;transition:transform .2s,background .2s}
  .asst-form-row button:hover{background:var(--sun-deep);transform:translateY(-1px)}
  .asst-form-row button:disabled{opacity:.5;cursor:default;transform:none}
  @media(max-width:560px){.asst-wrap{padding:118px 16px 24px}.asst-msg{max-width:92%}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="daisy" viewBox="0 0 100 100">
      <g transform="translate(50 50)" fill="currentColor">
        <ellipse cx="0" cy="-23" rx="8.6" ry="18"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(45)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(90)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(135)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(180)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(225)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(270)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(315)"/>
      </g>
      <circle cx="50" cy="50" r="13.5" fill="#DAEF52"/>
    </symbol>
  </defs>
</svg>

<div id="site-nav"></div>
<script src="/assets/gate.js?v=3"></script>
<script src="/assets/nav.js?v=20261004b"></script>

<div class="asst-wrap">
  <div class="asst-head">
    <span class="kicker center"><svg aria-hidden="true" class="daisy" style="width:16px;height:16px"><use href="#daisy"/></svg>Assistant FLORE Exposants</span>
    <h1>Posez votre question</h1>
    <p>Stand, électricité, montage, produits, règles : posez votre question sur votre participation à FLORE, on vous répond directement ou on vous recontacte rapidement.</p>
  </div>

  <div class="asst-contact">
    <div style="flex:1 1 140px;min-width:0">
      <label for="asst-nom">Prénom (optionnel)</label>
      <input type="text" id="asst-nom" autocomplete="given-name">
    </div>
    <div style="flex:1 1 200px;min-width:0">
      <label for="asst-contact">E-mail (optionnel)</label>
      <input type="email" id="asst-contact" autocomplete="email">
    </div>
    <span class="asst-contact-note">Utile seulement si on ne trouve pas la réponse tout de suite, pour vous recontacter.</span>
  </div>

  <div class="asst-chat" id="asst-chat"></div>

  <form class="asst-form-row" id="asst-form">
    <input type="text" id="asst-input" placeholder="Votre question…" maxlength="1000" required autocomplete="off">
    <button type="submit" id="asst-submit">Envoyer</button>
  </form>
</div>

<div id="site-footer"></div>
<script src="/assets/footer.js?v=20261004a"></script>
<script src="/legal.js?v=20261004b" defer></script>

<script>
(function(){
  var API_URL = "https://flore-admin.morgan-thisisit.workers.dev/assistant/ask";

  var chat = document.getElementById("asst-chat");
  var form = document.getElementById("asst-form");
  var input = document.getElementById("asst-input");
  var submitBtn = document.getElementById("asst-submit");
  var nomField = document.getElementById("asst-nom");
  var contactField = document.getElementById("asst-contact");

  function addMsg(text, cls){
    var el = document.createElement("div");
    el.className = "asst-msg " + cls;
    el.textContent = text;
    chat.appendChild(el);
    el.scrollIntoView({ behavior: "smooth", block: "end" });
    return el;
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var question = input.value.trim();
    if (!question) return;

    addMsg(question, "user");
    input.value = "";
    submitBtn.disabled = true;
    var attente = addMsg("…", "bot pending");

    var contact = contactField.value.trim();
    var payload = { question: question };
    if (nomField.value.trim()) payload.contact_nom = nomField.value.trim();
    if (contact) payload.contact_email = contact;

    try {
      var res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      var data = await res.json();
      attente.remove();
      if (!res.ok) {
        addMsg(data.error || "Une erreur est survenue, réessayez dans un instant.", "bot escalade");
      } else {
        addMsg(data.reponse, data.trouve_dans_docs ? "bot" : "bot escalade");
      }
    } catch (err) {
      attente.remove();
      addMsg("Connexion impossible, réessayez dans un instant.", "bot escalade");
    } finally {
      submitBtn.disabled = false;
      input.focus();
    }
  });
})();
</script>

</body>
</html>
