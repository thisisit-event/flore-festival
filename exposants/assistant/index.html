<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant exposants · FLORE Festival 2027</title>
<meta name="description" content="Posez vos questions sur votre participation à FLORE Festival : stand, électricité, montage, produits, règles.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2D5479">
<link rel="canonical" href="https://flore-festival.fr/exposants/assistant/">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/flore.css?v=20261004c">
<style>
  .asst-page{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:130px 20px 60px}
  .asst-wrap{max-width:640px;margin:0 auto;width:100%}
  .asst-head{text-align:center;margin-bottom:28px}
  .asst-head h1{font-size:clamp(1.9rem,4.4vw,2.6rem);color:var(--ink);margin-bottom:10px}
  .asst-head p{color:var(--ink-soft);font-size:1rem;max-width:42em;margin:0 auto}

  .ask-card{background:#fff;border-radius:24px;box-shadow:0 20px 50px rgba(21,57,91,.14);border:1.5px solid var(--line);
    padding:22px 24px;margin-bottom:28px}
  .ask-input{width:100%;border:none;outline:none;resize:none;font:inherit;font-size:1.08rem;color:var(--ink);
    background:transparent;min-height:64px;line-height:1.5}
  .ask-input::placeholder{color:var(--ink-soft)}
  .ask-divider{height:1px;background:var(--line);margin:14px 0}
  .ask-contact-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .ask-field{flex:1 1 150px;min-width:0}
  .ask-field label{font-family:'Telegraf',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:5px}
  .ask-field input{width:100%;border:none;border-bottom:1.5px solid var(--line);border-radius:0;padding:4px 2px 7px;
    font-size:.92rem;color:var(--ink);background:transparent}
  .ask-field input:focus{outline:none;border-color:var(--sky-deep)}
  .ask-submit{flex:0 0 auto;background:var(--sun);color:var(--ink);border:none;border-radius:100px;
    padding:12px 26px;font-family:'Telegraf',sans-serif;font-weight:700;font-size:.92rem;cursor:pointer;
    white-space:nowrap;transition:transform .2s,background .2s}
  .ask-submit:hover{background:var(--sun-deep);transform:translateY(-1px)}
  .ask-submit:disabled{opacity:.5;cursor:default;transform:none}

  .asst-chat{display:flex;flex-direction:column;gap:14px}
  .asst-exchange{background:#fff;border-radius:18px;border:1.5px solid var(--line);padding:18px 20px;
    box-shadow:0 6px 18px rgba(21,57,91,.06)}
  .asst-q{font-size:.78rem;font-weight:700;letter-spacing:.02em;color:var(--sky-deep);margin-bottom:8px}
  .asst-a{font-size:.96rem;line-height:1.55;color:var(--ink)}
  .asst-exchange.escalade{background:#FFF9E8;border-color:#F0E2A6}
  .asst-exchange.pending .asst-a{opacity:.55}
  @media(max-width:560px){.asst-page{padding:118px 16px 40px}.ask-card{padding:18px 18px;border-radius:20px}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="daisy" viewBox="0 0 100 100">
      <g transform="translate(50 50)" fill="currentColor">
        <ellipse cx="0" cy="-23" rx="8.6" ry="18"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(45)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(90)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(135)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(180)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(225)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(270)"/>
        <ellipse cx="0" cy="-23" rx="8.6" ry="18" transform="rotate(315)"/>
      </g>
      <circle cx="50" cy="50" r="13.5" fill="#DAEF52"/>
    </symbol>
  </defs>
</svg>

<div id="site-nav"></div>
<script src="/assets/gate.js?v=3"></script>
<script src="/assets/nav.js?v=20261004b"></script>

<div class="asst-page">
<div class="asst-wrap">
  <div class="asst-head">
    <span class="kicker center"><svg aria-hidden="true" class="daisy" style="width:16px;height:16px"><use href="#daisy"/></svg>Assistant FLORE Exposants</span>
    <h1>Posez votre question</h1>
    <p>Stand, électricité, montage, produits, règles : posez votre question sur votre participation à FLORE, on vous répond directement ou on vous recontacte rapidement.</p>
  </div>

  <form id="asst-form">
    <div class="ask-card">
      <textarea class="ask-input" id="asst-input" placeholder="Écrivez votre question ici…" maxlength="1000" required rows="2"></textarea>
      <div class="ask-divider"></div>
      <div class="ask-contact-row">
        <div class="ask-field">
          <label for="asst-nom">Prénom (optionnel)</label>
          <input type="text" id="asst-nom" autocomplete="given-name">
        </div>
        <div class="ask-field">
          <label for="asst-contact">E-mail</label>
          <input type="email" id="asst-contact" autocomplete="email" required>
        </div>
        <button type="submit" class="ask-submit" id="asst-submit">Envoyer</button>
      </div>
    </div>
  </form>

  <div class="asst-chat" id="asst-chat"></div>
</div>
</div>

<div id="site-footer"></div>
<script src="/assets/footer.js?v=20261004a"></script>
<script src="/legal.js?v=20261004b" defer></script>

<script>
(function(){
  var API_URL = "https://flore-admin.morgan-thisisit.workers.dev/assistant/ask";

  var chat = document.getElementById("asst-chat");
  var form = document.getElementById("asst-form");
  var input = document.getElementById("asst-input");
  var submitBtn = document.getElementById("asst-submit");
  var nomField = document.getElementById("asst-nom");
  var contactField = document.getElementById("asst-contact");

  function addExchange(question){
    var el = document.createElement("div");
    el.className = "asst-exchange pending";
    var q = document.createElement("div");
    q.className = "asst-q";
    q.textContent = question;
    var a = document.createElement("div");
    a.className = "asst-a";
    a.textContent = "…";
    el.appendChild(q);
    el.appendChild(a);
    chat.insertBefore(el, chat.firstChild);
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    return { el: el, a: a };
  }

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    var question = input.value.trim();
    if (!question) return;

    var contact = contactField.value.trim();
    if (!contact) {
      contactField.focus();
      contactField.reportValidity();
      return;
    }

    input.value = "";
    submitBtn.disabled = true;
    var exchange = addExchange(question);

    var payload = { question: question, contact_email: contact };
    if (nomField.value.trim()) payload.contact_nom = nomField.value.trim();

    try {
      var res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      var data = await res.json();
      exchange.el.classList.remove("pending");
      if (!res.ok) {
        exchange.a.textContent = data.error || "Une erreur est survenue, réessayez dans un instant.";
        exchange.el.classList.add("escalade");
      } else {
        exchange.a.textContent = data.reponse;
        if (!data.trouve_dans_docs) exchange.el.classList.add("escalade");
      }
    } catch (err) {
      exchange.el.classList.remove("pending");
      exchange.a.textContent = "Connexion impossible, réessayez dans un instant.";
      exchange.el.classList.add("escalade");
    } finally {
      submitBtn.disabled = false;
      input.focus();
    }
  });
})();
</script>

</body>
</html>
